apiVersion: v1
kind: Pod
metadata:
  name: leaf1
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name": "lab1", "cni-args": {"device": "leaf1"}}]'
spec:
  containers:
    - name: main
      image: alpine:3.22
      command: [sleep, infinity]

