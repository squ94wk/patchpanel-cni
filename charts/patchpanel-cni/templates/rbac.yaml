apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchpanel-agent
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patchpanel-agent
rules:
  - apiGroups: [patchpanel.squ94wk.github.io]
    resources: [topologies]
    verbs: [get]
  - apiGroups: [patchpanel.squ94wk.github.io]
    resources: [deviceassociations]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [patchpanel.squ94wk.github.io]
    resources: [deviceassociations/status]
    verbs: [update]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patchpanel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patchpanel-agent
subjects:
  - kind: ServiceAccount
    name: patchpanel-agent
    namespace: {{ .Release.Namespace }}
