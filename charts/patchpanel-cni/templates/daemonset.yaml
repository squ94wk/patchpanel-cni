apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: patchpanel-agent
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: patchpanel-agent
  template:
    metadata:
      labels:
        app: patchpanel-agent
    spec:
      serviceAccountName: patchpanel-agent
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-cni
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - cp /usr/local/bin/patchpanel /opt/cni/bin/patchpanel.tmp && mv /opt/cni/bin/patchpanel.tmp /opt/cni/bin/patchpanel
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
      containers:
        - name: agent
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            # The park netns is pinned here, so it must be visible on the host.
            - name: netns
              mountPath: /run/netns
              mountPropagation: Bidirectional
            - name: socket
              mountPath: /run/patchpanel
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
        - name: socket
          hostPath:
            path: /run/patchpanel
            type: DirectoryOrCreate
