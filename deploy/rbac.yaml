apiVersion: v1
kind: Namespace
metadata:
  name: dcnet-system
  labels:
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcnet-agent
  namespace: dcnet-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dcnet-agent
rules:
  - apiGroups: [dcnet.squ94wk.github.io]
    resources: [topologies]
    verbs: [get]
  - apiGroups: [dcnet.squ94wk.github.io]
    resources: [deviceassociations]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [dcnet.squ94wk.github.io]
    resources: [deviceassociations/status]
    verbs: [update]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dcnet-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dcnet-agent
subjects:
  - kind: ServiceAccount
    name: dcnet-agent
    namespace: dcnet-system
